<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css"><script src="/static/common.js"></script><title>Sign in - IttisalX FileServer</title></head><body>
<div class="login">
<div class="brand"><picture><source media="(prefers-color-scheme: dark)" srcset="/static/logo-dark.svg"><img src="/static/logo.svg" alt="IttisalX" width="48" height="48"></picture><span>IttisalX FileServer</span></div>
<form class="card" id="f">
<h1>Sign in</h1>
<label for="u">Username</label><input id="u" autocomplete="username" value="admin" required>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required autofocus>
<div id="codebox" hidden><label for="c">Authentication code</label><input id="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><p class="muted">Enter the 6-digit code from your authenticator app.</p></div>
<div class="actions"><button class="primary" id="go">Sign in</button><span class="msg" id="m" role="alert"></span></div>
</form>
<p class="muted" style="text-align:center">Forgot your password? Run <code>python3 server.py reset-password</code> on the server.</p>
</div><footer>IttisalX FileServer v{{version}} &middot; an IttisalX open-source project &middot; <a href="{{website}}" target="_blank" rel="noopener">ittisal.com</a></footer>
<script>
$("#f").onsubmit = async e => {
  e.preventDefault(); say($("#m"), "");
  try {
    const r = await api("/api/login", {username: $("#u").value, password: $("#p").value, code: $("#c").value});
    if (r.need_code) { $("#codebox").hidden = false; $("#c").focus(); return; }
    location.href = r.must_change ? "/settings" : "/";
  } catch (err) { say($("#m"), err.message); }
};
</script></body></html>
